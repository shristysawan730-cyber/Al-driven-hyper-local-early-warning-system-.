<svg width="680" height="590" viewBox="0 0 680 590" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>System architecture for AI-driven hyperlocal severe weather nowcasting</title>
<desc>Four data sources feed a dynamic data trust engine, which flows through storm intensification tracking, uncertainty-aware prediction, and a dynamic hyperlocal risk map, then into a continuous learning loop that feeds back into the trust engine.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="590" fill="#ffffff"/>

<g>
<rect x="40" y="40" width="130" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="105" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Radar</text>
</g>
<g>
<rect x="190" y="40" width="130" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="255" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Satellite</text>
</g>
<g>
<rect x="340" y="40" width="130" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="405" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">AWS</text>
</g>
<g>
<rect x="490" y="40" width="130" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="555" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Lightning</text>
</g>

<line x1="105" y1="84" x2="105" y2="104" stroke="#73726c" stroke-width="1.5"/>
<line x1="255" y1="84" x2="255" y2="104" stroke="#73726c" stroke-width="1.5"/>
<line x1="405" y1="84" x2="405" y2="104" stroke="#73726c" stroke-width="1.5"/>
<line x1="555" y1="84" x2="555" y2="104" stroke="#73726c" stroke-width="1.5"/>
<line x1="105" y1="104" x2="555" y2="104" stroke="#73726c" stroke-width="1.5"/>
<line x1="340" y1="104" x2="340" y2="150" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="180" y="150" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="168" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Dynamic data trust engine</text>
<text x="340" y="186" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">AI weighs how much to trust each source</text>
</g>

<line x1="340" y1="206" x2="340" y2="236" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="170" y="236" width="340" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="254" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Storm intensification tracking</text>
<text x="340" y="272" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Tracks how fast the storm is strengthening</text>
</g>

<line x1="340" y1="292" x2="340" y2="322" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="190" y="322" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="340" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Uncertainty-aware prediction</text>
<text x="340" y="358" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Impact window with confidence range</text>
</g>

<line x1="340" y1="378" x2="340" y2="408" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="190" y="408" width="300" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="340" y="426" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#72243E">Dynamic hyperlocal risk map</text>
<text x="340" y="444" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993556">Risk zones shift as the storm evolves</text>
</g>

<line x1="340" y1="464" x2="340" y2="494" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="140" y="494" width="400" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="512" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Continuous learning loop</text>
<text x="340" y="530" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">Compares prediction to outcome and recalibrates</text>
</g>

<path d="M540 522 L600 522 L600 178 L500 178" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="608" y="170" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#444441">&#8635;</text>
</svg>
